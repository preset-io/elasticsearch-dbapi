# Python unit tests
name: Python

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master', 'release/**']

jobs:
  release-contract:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sqlalchemy: ["1.4.54", "2.0.29"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build and contract test dependencies
        run: pip install setuptools wheel pytest "sqlalchemy==${{ matrix.sqlalchemy }}" -e .
      - name: Check dirty-tree artifacts and cross-dialect type portability
        run: pytest -v tests/test_release_packaging.py es/tests/test_type_portability.py

  lint:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: black
        run: black --check setup.py es
      - name: flake8
        run: flake8 es
      - name: mypy
        run: mypy es

  test-elasticsearch7:
    runs-on: ubuntu-22.04
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.27
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports:
          - 9200:9200
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Wait for Elasticsearch 7.x
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:9200/_cluster/health && break
            echo "Waiting for Elasticsearch 7.x..."
            sleep 2
          done
      - name: Run tests on Elasticsearch 7.x
        run: |
          export ES_URI="http://localhost:9200"
          export ES_PORT=9200
          pytest -v --cov=es --cov-report=xml es/tests

  test-elasticsearch8:
    runs-on: ubuntu-22.04
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
        ports:
          - 9200:9200
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Wait for Elasticsearch 8.x
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:9200/_cluster/health && break
            echo "Waiting for Elasticsearch 8.x..."
            sleep 2
          done
      - name: Run tests on Elasticsearch 8.x
        env:
          ELASTIC_CLIENT_APIVERSIONING: "1"
        run: |
          export ES_URI="http://localhost:9200"
          export ES_PORT=9200
          pytest -v --cov=es --cov-report=xml es/tests

  test-opensearch:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        opensearch-version: ["1.3.20", "2.11.1", "2.15.0", "2.19.0", "3.2.0"]
    name: test-opensearch (${{ matrix.opensearch-version }})
    services:
      opensearch:
        image: opensearchproject/opensearch:${{ matrix.opensearch-version }}
        env:
          discovery.type: single-node
          plugins.security.disabled: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:9200/_cluster/health && break
            echo "Waiting for OpenSearch..."
            sleep 2
          done
          curl -fsS http://localhost:9200/_cluster/health
      - name: Run tests on OpenSearch
        run: |
          export ES_DRIVER=odelasticsearch
          export ES_URI="http://localhost:9200"
          export ES_PORT=9200
          export ES_SCHEME=http
          export ES_V2=True
          export ES_SUPPORT_DATETIME_PARSE=False
          pytest -v --cov=es --cov-report=xml es/tests
  test-opendistro:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # "false" (hardened clusters) answers /_plugins/_sql with a 404
        # index_not_found_exception instead of invalid_index_name_exception
        auto-create-index: ["true", "false"]
    name: test-opendistro (auto_create_index=${{ matrix.auto-create-index }})
    services:
      opendistro:
        image: amazon/opendistro-for-elasticsearch:1.13.2
        env:
          discovery.type: single-node
          opendistro_security.disabled: "true"
          action.auto_create_index: ${{ matrix.auto-create-index }}
        ports:
          - 9200:9200
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Wait for Open Distro
        run: |
          for i in $(seq 1 60); do
            curl -s http://localhost:9200/_cluster/health && break
            echo "Waiting for Open Distro..."
            sleep 2
          done
      - name: Run tests on Open Distro 1.13 (Elasticsearch 7.10)
        # No sql_path in the connection: exercises the fallback from
        # _plugins/_sql to _opendistro/_sql
        run: |
          export ES_DRIVER=odelasticsearch
          export ES_URI="http://localhost:9200"
          export ES_PORT=9200
          export ES_SCHEME=http
          export ES_V2=True
          export ES_SUPPORT_DATETIME_PARSE=False
          pytest -v --cov=es --cov-report=xml es/tests
